<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gemerald | Luxury Candles, Diffusers &amp; Perfumes</title>
    <meta
      name="description"
      content="Handcrafted scented candles, reed diffusers, gift sets and Arabian perfumes by Gemerald. Order easily on WhatsApp."
    />
    <meta name="theme-color" content="#0f0f0f" />

    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />

    <!-- Link previews (WhatsApp, Instagram, X, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gemerald" />
    <meta property="og:title" content="Gemerald | Luxury Candles, Diffusers & Perfumes" />
    <meta
      property="og:description"
      content="Handcrafted scented candles, reed diffusers, gift sets and Arabian perfumes."
    />
    <meta property="og:url" content="https://gemerald.vercel.app/" />
    <meta property="og:image" content="https://gemerald.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="720" />
    <meta property="og:image:height" content="1280" />
    <meta name="twitter:image" content="https://gemerald.vercel.app/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: connect early and load in parallel with the app instead of via CSS @import -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&display=swap"
    />

    <!-- Start the Firestore connection before the app asks for products -->
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
